<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TH Server Online Status</title>

<style>
body{
    margin:0;
    font-family:system-ui, sans-serif;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:#fff;
}
.container{
    max-width:520px;
    margin:auto;
    padding:20px;
}
h1{
    text-align:center;
    margin-bottom:20px;
}
.card{
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(10px);
    border-radius:16px;
    padding:16px 20px;
    margin-bottom:14px;
    box-shadow:0 10px 25px rgba(0,0,0,.35);
}
.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:6px 0;
}
.badge{
    padding:4px 12px;
    border-radius:20px;
    font-size:13px;
}
.online{background:#00c853;}
.offline{background:#d50000;}
.footer{
    text-align:center;
    font-size:12px;
    opacity:.8;
    margin-top:15px;
}
</style>
</head>

<body>
<div class="container">
<h1>📡 Server Online (TH)</h1>

<div id="servers"></div>

<div class="footer">อัปเดตทุก 10 วินาที</div>
</div>

<script>
const servers=[
 {name:"TH1",url:"http://45.144.167.176:81/server/online.json"},
 {name:"TH2",url:"http://82.26.104.151:81/server/online.json"},
 {name:"TH3",url:"http://82.26.104.196:81/server/online.json"},
 {name:"TH4",url:"http://82.26.104.197:81/server/online.json"},
 {name:"TH5",url:"http://82.26.104.199:81/server/online.json"}
];

const container=document.getElementById("servers");

servers.forEach(s=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`
        <div class="row">
            <strong>${s.name}</strong>
            <span id="${s.name}-status" class="badge offline">LOADING</span>
        </div>
        <div class="row">
            <span>คนออนไลน์</span>
            <span id="${s.name}-count">-</span>
        </div>
    `;
    container.appendChild(div);
});

async function loadStatus(){
    for(const s of servers){
        try{
            const res=await fetch(s.url,{cache:"no-store"});
            if(!res.ok) throw "offline";
            const data=await res.json();

            document.getElementById(s.name+"-status").textContent="ONLINE";
            document.getElementById(s.name+"-status").className="badge online";
            document.getElementById(s.name+"-count").textContent=
                data.online ?? data.users ?? data.count ?? "0";

        }catch(e){
            document.getElementById(s.name+"-status").textContent="OFFLINE";
            document.getElementById(s.name+"-status").className="badge offline";
            document.getElementById(s.name+"-count").textContent="-";
        }
    }
}

loadStatus();
setInterval(loadStatus,10000);
</script>

</body>
</html>
