<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Server Monitor</title>

<style>

body{
    background:#020617;
    font-family:system-ui,sans-serif;
    color:white;
    text-align:center;
    padding:15px;
}

/* โลโก้ */
.logo{
    width:70px;
    margin:10px auto;
}

/* หัว */
h2{
    color:#38bdf8;
    margin:5px 0;
}

/* รวมทั้งหมด */
.total{
    margin:10px 0 15px;
    font-size:18px;
    color:#22c55e;
}

/* กล่องหลัก */
.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
    max-width:700px;
    margin:auto;
}

/* การ์ด */
.card{
    background:#020617;
    border:1px solid #0f172a;
    border-radius:8px;
    padding:10px 5px;
    box-shadow:0 0 6px #0ea5e933;
}

/* ชื่อ */
.server{
    font-size:13px;
    color:#94a3b8;
}

/* จำนวน */
.count{
    font-size:22px;
    font-weight:600;
    margin-top:3px;
}

/* ping */
.ping{
    font-size:11px;
    color:#64748b;
}

/* สี */
.low{color:#facc15;}
.mid{color:#22c55e;}
.high{color:#38bdf8;}
.off{color:#ef4444;}

.footer{
    margin-top:12px;
    font-size:11px;
    color:#64748b;
}

</style>
</head>

<body>

<!-- โลโก้ (เปลี่ยนรูปได้) -->
<img src="https://i.imgur.com/7Q9Z1Zm.png" class="logo">

<h2>Server Monitor</h2>

<div class="total" id="total">
กำลังโหลด...
</div>

<div class="container">

<div class="card">
<div class="server">TH1</div>
<div class="count" id="s1">...</div>
<div class="ping" id="p1">...</div>
</div>

<div class="card">
<div class="server">TH2</div>
<div class="count" id="s2">...</div>
<div class="ping" id="p2">...</div>
</div>

<div class="card">
<div class="server">TH3</div>
<div class="count" id="s3">...</div>
<div class="ping" id="p3">...</div>
</div>

<div class="card">
<div class="server">TH4</div>
<div class="count" id="s4">...</div>
<div class="ping" id="p4">...</div>
</div>

<div class="card">
<div class="server">TH5</div>
<div class="count" id="s5">...</div>
<div class="ping" id="p5">...</div>
</div>

</div>

<div class="footer">
Auto Update ทุก 5 วินาที
</div>

<script>

const servers = [
 { id:"s1", ping:"p1", url:"http://45.144.167.176:81/server/online.json" },
 { id:"s2", ping:"p2", url:"http://82.26.104.151:81/server/online.json" },
 { id:"s3", ping:"p3", url:"http://82.26.104.196:81/server/online.json" },
 { id:"s4", ping:"p4", url:"http://82.26.104.197:81/server/online.json" },
 { id:"s5", ping:"p5", url:"http://82.26.104.199:81/server/online.json" }
];

// วัด ping
async function ping(url){
    const start = performance.now();
    await fetch(url,{cache:"no-store"});
    return Math.round(performance.now()-start);
}

function setColor(el,num){

    el.className="count";

    if(num<20) el.classList.add("low");
    else if(num<50) el.classList.add("mid");
    else el.classList.add("high");
}

async function load(){

    let total = 0;

    for(const s of servers){

        const el = document.getElementById(s.id);
        const pl = document.getElementById(s.ping);

        try{

            const start = performance.now();
            const r = await fetch(s.url,{cache:"no-store"});
            const d = await r.json();
            const end = performance.now();

            let num = d.online ?? d.count ?? d;

            total += Number(num);

            el.innerHTML = num+" คน";
            setColor(el,num);

            pl.innerHTML = "Ping: "+Math.round(end-start)+" ms";

        }catch{

            el.innerHTML="OFFLINE";
            el.className="count off";

            pl.innerHTML="No Signal";
        }
    }

    document.getElementById("total").innerHTML =
    "👥 ออนไลน์ทั้งหมด: "+total+" คน";
}

load();
setInterval(load,5000);

</script>

</body>
</html>
